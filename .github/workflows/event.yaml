on:
    push:
    pull request:
    #when we merge branch to main, we want to run the workflow
    schedule:
      - cron: '*/5 * * * *' #runs every 5 minutes
    workflow_dispatch:
  
  jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
          - name: Show the trigger
            run: echo "This workflow was triggered by a(n) ${{ github.event_name }} event."